<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Learning: SQL, Python, pandas, machine learning, data structures and algorithms, AI engineering with LLMs, JavaScript and TypeScript, and Java from scratch">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e3e8ec" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f4f6f7" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#f4f6f7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f4f6f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#f4f6f7"/>
  <rect width="1280" height="360" rx="20" fill="url(#g)"/>
  <rect width="1280" height="360" rx="20" fill="url(#fade)"/>

  <text x="64" y="92" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#5b697b">FREE · HANDS-ON · RUNS IN YOUR BROWSER</text>
  <text x="60" y="186" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#16202b">Learning</text>
  <text x="64" y="236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" fill="#5b697b">Learn <tspan fill="#0e7466" font-weight="700">SQL</tspan>, <tspan fill="#2c679c" font-weight="700">Python</tspan>, <tspan fill="#4b3ca8" font-weight="700">pandas</tspan>, <tspan fill="#b42357" font-weight="700">ML</tspan>, <tspan fill="#2e7d32" font-weight="700">DSA</tspan>, <tspan fill="#7e22ce" font-weight="700">AI</tspan>, <tspan fill="#a15c07" font-weight="700">JS</tspan> and <tspan fill="#e8730c" font-weight="700">Java</tspan> from scratch.</text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#5b697b">
    <text x="64" y="292"><tspan fill="#16202b" font-weight="700">301</tspan> lessons</text>
    <text x="190" y="292"><tspan fill="#16202b" font-weight="700">648</tspan> auto-checked exercises</text>
    <text x="442" y="292"><tspan fill="#16202b" font-weight="700">0</tspan> installs</text>
  </g>

  <g transform="translate(700 30) rotate(-3)">
    <rect width="410" height="98" rx="14" fill="#ffffff" stroke="#d8dee4"/>
    <rect width="410" height="6" rx="3" fill="#0e7466"/>
    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="16" fill="#16202b">
      <text x="22" y="36" xml:space="preserve"><tspan fill="#0e7466" font-weight="700">SELECT</tspan> name, SUM(amount)</text>
      <text x="22" y="61" xml:space="preserve"><tspan fill="#0e7466" font-weight="700">FROM</tspan> orders</text>
      <text x="22" y="86" xml:space="preserve"><tspan fill="#0e7466" font-weight="700">GROUP BY</tspan> name;</text>
    </g>
  </g>

  <g transform="translate(830 128) rotate(2)">
    <rect width="410" height="98" rx="14" fill="#ffffff" stroke="#d8dee4"/>
    <rect width="246" height="6" rx="3" fill="#e8730c"/>
    <rect x="246" width="164" height="6" rx="3" fill="#3a6d96"/>
    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="16" fill="#16202b">
      <text x="22" y="36" xml:space="preserve"><tspan fill="#b4530a" font-weight="700">record</tspan> Point(<tspan fill="#b4530a" font-weight="700">int</tspan> x, <tspan fill="#b4530a" font-weight="700">int</tspan> y) {}</text>
      <text x="22" y="61" xml:space="preserve"><tspan fill="#b4530a" font-weight="700">var</tspan> p = <tspan fill="#b4530a" font-weight="700">new</tspan> Point(3, 4);</text>
      <text x="22" y="86" xml:space="preserve">System.out.println(p);</text>
    </g>
  </g>

  <g transform="translate(686 248) rotate(-1)">
    <rect width="410" height="98" rx="14" fill="#ffffff" stroke="#d8dee4"/>
    <rect width="246" height="6" rx="3" fill="#2c679c"/>
    <rect x="246" width="164" height="6" rx="3" fill="#e8b417"/>
    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="16" fill="#16202b">
      <text x="22" y="36" xml:space="preserve"><tspan fill="#2c5fa8" font-weight="700">def</tspan> greet(name):</text>
      <text x="22" y="61" xml:space="preserve">    <tspan fill="#2c5fa8" font-weight="700">return</tspan> <tspan fill="#4b7a2e">f&quot;Hello, {name}!&quot;</tspan></text>
      <text x="22" y="86" xml:space="preserve"><tspan fill="#2c5fa8" font-weight="700">print</tspan>(greet(<tspan fill="#4b7a2e">&quot;Ada&quot;</tspan>))</text>
    </g>
  </g>
</svg>
